<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeAI Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }

  .container { max-width: 720px; margin: 40px auto; padding: 0 16px; }

  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 600; }
  .lang-toggle { font-size: 13px; color: #6366f1; cursor: pointer; user-select: none; }
  .lang-toggle:hover { text-decoration: underline; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  label { font-size: 13px; font-weight: 500; color: #444; display: block; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0;
    border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
  }
  input:focus, textarea:focus { border-color: #6366f1; }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .row { display: flex; gap: 12px; margin-bottom: 14px; }
  .row > div { flex: 1; }

  button {
    width: 100%; padding: 11px; background: #6366f1; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #a5b4fc; cursor: not-allowed; }

  .output {
    min-height: 120px; background: #f9f9f9; border: 1px solid #e8e8e8;
    border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word; color: #222;
  }
  .output.empty { color: #aaa; }

  .meta { font-size: 12px; color: #999; margin-top: 8px; }
  .error { color: #e53e3e; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>BridgeAI</h1>
    <span class="lang-toggle" onclick="toggleLang()" id="langBtn">中文</span>
  </div>
  <p class="subtitle" id="subtitle">Multi-model routing gateway · Enter your key to get started</p>

  <div class="card">
    <div class="row">
      <div>
        <label id="labelKey">API Key</label>
        <input id="apiKey" type="password" placeholder="bridge-xxx" />
        <div style="margin-top:5px;font-size:12px;color:#999">
          <a href="apply.html" id="applyLink" style="color:#6366f1;text-decoration:none;">Don't have a key? Apply →</a>
        </div>
      </div>
      <div>
        <label id="labelModel">Model</label>
        <select id="model">
          <option value="smart-fast" id="optFast">smart-fast (Fast)</option>
          <option value="smart-quality" id="optQuality">smart-quality (Quality)</option>
          <optgroup label="OpenAI">
            <option value="gpt-4o" id="optGPT4o">GPT-4o</option>
            <option value="gpt-4o-mini" id="optGPT4oMini">GPT-4o mini</option>
            <option value="o4-mini" id="optO4Mini">o4-mini (Reasoning, non-streaming)</option>
          </optgroup>
          <optgroup label="Claude">
            <option value="claude-3-5-sonnet-latest" id="optSonnet">Claude 3.5 Sonnet</option>
            <option value="claude-3-5-haiku-latest" id="optHaiku">Claude 3.5 Haiku</option>
          </optgroup>
          <optgroup label="DeepSeek">
            <option value="deepseek-chat" id="optDeepseek">DeepSeek V3</option>
            <option value="deepseek-reasoner" id="optReasoner">DeepSeek R1 (Reasoning)</option>
          </optgroup>
          <optgroup label="Qwen">
            <option value="qwen3-235b" id="optQwen235">Qwen3 235B (Quality)</option>
            <option value="qwen3-30b" id="optQwen30">Qwen3 30B (Fast)</option>
          </optgroup>
          <optgroup label="Grok">
            <option value="grok-3" id="optGrok3">Grok-3</option>
            <option value="grok-3-mini" id="optGrok3Mini">Grok-3 mini</option>
          </optgroup>
          <optgroup label="Mistral">
            <option value="mistral-large" id="optMistralLarge">Mistral Large</option>
            <option value="mistral-small" id="optMistralSmall">Mistral Small</option>
          </optgroup>
          <optgroup label="Gemini">
            <option value="gemini-2.0-flash" id="optGemini">Gemini 2.0 Flash</option>
          </optgroup>
          <optgroup id="optgroupZhipu" label="Zhipu GLM · Tsinghua-backed · China's Top Choice">
            <option value="glm-4-plus">GLM-4 Plus</option>
            <option value="glm-4-flash">GLM-4 Flash (Free)</option>
          </optgroup>
          <optgroup label="Kimi · Moonshot AI">
            <option value="kimi-k2.5">Kimi K2.5 (128K)</option>
            <option value="moonshot-v1-32k">Moonshot v1 32K</option>
          </optgroup>
          <optgroup label="MiniMax">
            <option value="MiniMax-M2.7">MiniMax M2.7</option>
            <option value="MiniMax-M2.7-highspeed">MiniMax M2.7 Fast</option>
          </optgroup>
          <optgroup label="MiMo · Xiaomi">
            <option value="mimo-v2-pro">MiMo V2 Pro</option>
            <option value="mimo-v2-omni">MiMo V2 Omni</option>
          </optgroup>
          <optgroup label="豆包 · ByteDance">
            <option value="doubao-1.5-pro-32k">Doubao 1.5 Pro 32K</option>
            <option value="doubao-seed-1-6-flash">Doubao Seed 1.6 Flash</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div style="margin-bottom:14px">
      <label id="labelPrompt">Message</label>
      <textarea id="prompt" placeholder="Type your question here..."></textarea>
    </div>

    <button id="sendBtn" onclick="send()">Send</button>
    <div id="error" class="error"></div>
  </div>

  <div class="card">
    <label id="labelReply">Reply</label>
    <div id="output" class="output empty">Response will appear here...</div>
    <div id="meta" class="meta"></div>
  </div>
</div>

<script>
const API_BASE = "https://bridgeai-production-e475.up.railway.app/v1";

const i18n = {
  en: {
    title: "BridgeAI",
    subtitle: "Multi-model routing gateway · Enter your key to get started",
    labelKey: "API Key",
    labelModel: "Model",
    labelPrompt: "Message",
    promptPlaceholder: "Type your question here...",
    sendBtn: "Send",
    sending: "Sending...",
    labelReply: "Reply",
    outputEmpty: "Response will appear here...",
    errNoKey: "Please enter your API Key",
    errNoPrompt: "Please enter a message",
    metaTemplate: (elapsed, provider, id) => `${elapsed}s · Provider: ${provider} · request_id: ${id}`,
    optgroupZhipu: "Zhipu GLM · Tsinghua-backed · China's Top Choice",
    applyLink: "Don't have a key? Apply →",
    langBtn: "中文",
  },
  zh: {
    title: "桥智",
    subtitle: "多模型路由网关 · 填入 Key 即可使用",
    labelKey: "API Key",
    labelModel: "模型",
    labelPrompt: "消息内容",
    promptPlaceholder: "输入你想问的问题...",
    sendBtn: "发送",
    sending: "请求中...",
    labelReply: "回复",
    outputEmpty: "回复将显示在这里...",
    errNoKey: "请填入 API Key",
    errNoPrompt: "请输入内容",
    metaTemplate: (elapsed, provider, id) => `耗时 ${elapsed}s · 供应商 ${provider} · request_id ${id}`,
    optgroupZhipu: "智谱 GLM · 清华系 · 国产首选",
    applyLink: "没有 Key？点击申请 →",
    langBtn: "English",
  }
};

let lang = "en";

function toggleLang() {
  lang = lang === "en" ? "zh" : "en";
  applyLang();
}

function applyLang() {
  const t = i18n[lang];
  document.querySelector("h1").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("labelKey").textContent = t.labelKey;
  document.getElementById("labelModel").textContent = t.labelModel;
  document.getElementById("labelPrompt").textContent = t.labelPrompt;
  document.getElementById("prompt").placeholder = t.promptPlaceholder;
  document.getElementById("sendBtn").textContent = t.sendBtn;
  document.getElementById("labelReply").textContent = t.labelReply;
  document.getElementById("optgroupZhipu").label = t.optgroupZhipu;
  document.getElementById("applyLink").textContent = t.applyLink;
  document.getElementById("langBtn").textContent = t.langBtn;
  const output = document.getElementById("output");
  if (output.classList.contains("empty")) {
    output.textContent = t.outputEmpty;
  }
  document.documentElement.lang = lang;
}

async function send() {
  const t = i18n[lang];
  const key = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("model").value;
  const prompt = document.getElementById("prompt").value.trim();
  const btn = document.getElementById("sendBtn");
  const output = document.getElementById("output");
  const meta = document.getElementById("meta");
  const error = document.getElementById("error");

  error.textContent = "";
  if (!key) { error.textContent = t.errNoKey; return; }
  if (!prompt) { error.textContent = t.errNoPrompt; return; }

  btn.disabled = true;
  btn.textContent = t.sending;
  output.className = "output";
  output.textContent = "";
  meta.textContent = "";

  const start = Date.now();

  try {
    const res = await fetch(`${API_BASE}/chat/completions`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        model,
        messages: [{ role: "user", content: prompt }],
        stream: true,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || err.error || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") break;
        try {
          const chunk = JSON.parse(data);
          const text = chunk.choices?.[0]?.delta?.content || "";
          output.textContent += text;
        } catch {}
      }
    }

    const elapsed = ((Date.now() - start) / 1000).toFixed(2);
    const requestId = res.headers.get("X-BridgeAI-Request-Id") || "-";
    const provider = res.headers.get("X-BridgeAI-Provider") || "-";
    meta.textContent = t.metaTemplate(elapsed, provider, requestId);

  } catch (e) {
    error.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = t.sendBtn;
  }
}

document.getElementById("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
});
</script>
</body>
</html>

services:
  gateway:
    build:
      context: ./internal/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./internal/gateway/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
